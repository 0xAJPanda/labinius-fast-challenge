name: Benchmark arm dispatch

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# No concurrency group here: the called executor declares one, and an identical key on this
# caller would make the run wait on itself.
jobs:
  benchmark:
    # Runner-group admission must allow the public executor at this exact commit,
    # not to whichever ref Yukon dispatches. This caller requests no runner; it forwards the
    # dispatched repository and commit as the untrusted solution input.
    uses: Layr-Labs/labinius-fast-challenge/.github/workflows/benchmark-arm.yml@2cafc0d1250dcc0e895651c59646349fd8d3e4a8
    with:
      solution_repository: ${{ github.repository }}
      solution_ref: ${{ github.sha }}
    permissions:
      contents: read
      # The executor's x86 verify job deletes the ARM proof artifact once it is checked.
      actions: write
