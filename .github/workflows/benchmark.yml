name: Benchmark

on:
  workflow_dispatch:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string
  workflow_call:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string

permissions:
  contents: read
  actions: read

# No concurrency group here: the called executor declares one, and an identical key on this
# caller would make the run wait on itself.
jobs:
  benchmark:
    # Runner-group admission must allow the public executor at this exact commit,
    # not to whichever ref Yukon dispatches. This caller requests no runner; it forwards the
    # dispatched repository and commit as the untrusted solution input.
    uses: Layr-Labs/labinius-fast-challenge/.github/workflows/benchmark-x86.yml@2cafc0d1250dcc0e895651c59646349fd8d3e4a8
    with:
      solution_repository: ${{ inputs.solution_repository || github.repository }}
      solution_ref: ${{ inputs.solution_ref || github.sha }}
