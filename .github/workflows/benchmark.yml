name: Benchmark

on:
  workflow_dispatch:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string
  workflow_call:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.solution_ref || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Isolated pre-merge validation of PR #260. This exact executor revision
    # is admitted by the x86 runner group and runner-side policies.
    uses: Layr-Labs/labinius-fast-challenge/.github/workflows/benchmark-runner.yml@0b084481452c19db03d4e02b3c550f9158148d27
    with:
      solution_repository: ${{ inputs.solution_repository || github.repository }}
      solution_ref: ${{ inputs.solution_ref || github.sha }}
